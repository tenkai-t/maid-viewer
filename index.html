<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>メイド3Dビューア</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    background: linear-gradient(180deg, #fdf6ec 0%, #e8f6f1 70%, #d9efe7 100%);
    color:#33524a;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  header {
    padding: 14px 16px 6px;
    text-align:center;
  }
  header h1 { font-size: 22px; letter-spacing: .04em; color:#2b6a5c; }
  header p { font-size: 13px; color:#6b8a81; margin-top:2px; }
  #stage { flex:1; position:relative; }
  model-viewer {
    width:100%; height:100%;
    --poster-color: transparent;
  }
  #loading {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    font-size:15px; color:#2b6a5c; pointer-events:none;
  }
  #bar { width:min(70vw, 280px); height:10px; border-radius:6px; background:#ffffffa8; overflow:hidden; }
  #barfill { height:100%; width:0%; background:#e8a2b8; border-radius:6px; transition:width .2s; }
  footer {
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  button {
    font-family:inherit; font-size:16px; font-weight:700;
    padding: 12px 20px; border-radius: 999px; border: 2px solid #2b6a5c;
    background:#fff; color:#2b6a5c; cursor:pointer;
    box-shadow: 0 2px 6px rgba(43,106,92,.18);
  }
  button.on { background:#2b6a5c; color:#fff; }
  .hint { text-align:center; font-size:12px; color:#7d9a92; padding-bottom:8px; }
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
<header>
  <h1>✦ メイド 3Dビューア ✦</h1>
  <p>歩く姿をスマホで見られます</p>
</header>

<div id="stage">
  <model-viewer id="mv"
    src="maid.glb"
    autoplay
    camera-controls
    touch-action="pan-y"
    shadow-intensity="0.9"
    shadow-softness="0.6"
    exposure="1.05"
    camera-orbit="0deg 72deg 3.2m"
    min-camera-orbit="auto auto 1.6m"
    max-camera-orbit="auto auto 6m"
    field-of-view="32deg"
    alt="歩くメイドの3Dモデル">
  </model-viewer>
  <div id="loading">
    <div>読み込み中…</div>
    <div id="bar"><div id="barfill"></div></div>
    <div id="pct">0%</div>
  </div>
</div>

<footer>
  <button id="btnWalk" class="on">⏸ 歩くのを止める</button>
  <button id="btnSpin">🔄 自動で回す</button>
</footer>
<div class="hint">指でドラッグ＝回す ／ ピンチ＝拡大・縮小 ／ 2本指ドラッグ＝移動</div>

<script>
  const mv = document.getElementById('mv');
  const loading = document.getElementById('loading');
  const barfill = document.getElementById('barfill');
  const pct = document.getElementById('pct');
  mv.addEventListener('progress', (e) => {
    const p = Math.round((e.detail.totalProgress || 0) * 100);
    barfill.style.width = p + '%';
    pct.textContent = p + '%';
  });
  mv.addEventListener('load', () => { loading.style.display = 'none'; });
  mv.addEventListener('error', () => { pct.textContent = '読み込みに失敗しました。通信環境の良い場所で開き直してください'; });

  const btnWalk = document.getElementById('btnWalk');
  let walking = true;
  btnWalk.addEventListener('click', () => {
    walking = !walking;
    if (walking) { mv.play(); btnWalk.textContent = '⏸ 歩くのを止める'; btnWalk.classList.add('on'); }
    else { mv.pause(); btnWalk.textContent = '▶ 歩かせる'; btnWalk.classList.remove('on'); }
  });

  const btnSpin = document.getElementById('btnSpin');
  let spin = false;
  btnSpin.addEventListener('click', () => {
    spin = !spin;
    mv.autoRotate = spin;
    btnSpin.classList.toggle('on', spin);
  });
</script>
</body>
</html>
